services:
  - type: web
    name: cesta-api
    runtime: node
    rootDir: cesta-api
    # Sprint 183 (ADR 0013): migrate deploy wrapped in retry 3x
    # backoff 10/20/40s to survive transient P1002 Neon.
    buildCommand: bash render-build.sh
    startCommand: node dist/src/main.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      # Sprint 183 (ADR 0013): DATABASE_URL_UNPOOLED is DERIVED at build
      # time in render-build.sh by stripping "-pooler" from DATABASE_URL.
      # Not set as an env var (incident S134: dashboard PUT wiped all vars).
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Sprint 92 rotação: durante swap, promover CURRENT → PREVIOUS e gerar
      # novo CURRENT. Zero-downtime; tokens emitidos pelo valor antigo seguem
      # válidos até expirar (access 15m, refresh 7d).
      - key: JWT_ACCESS_SECRET_CURRENT
        generateValue: true
      - key: JWT_ACCESS_SECRET_PREVIOUS
        sync: false
      - key: JWT_REFRESH_SECRET_CURRENT
        generateValue: true
      - key: JWT_REFRESH_SECRET_PREVIOUS
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: VAPID_PUBLIC_KEY
        value: disabled
      - key: VAPID_PRIVATE_KEY
        value: disabled
      - key: VAPID_SUBJECT
        value: mailto:contact@cesta.app
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: '0'
      - key: WEB_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
