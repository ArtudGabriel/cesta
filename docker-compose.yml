services:
  postgres:
    image: postgres:16-alpine
    container_name: cesta-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cesta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cesta_dev}
    volumes:
      - cesta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cesta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cesta-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cesta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cesta_pg_data:
  cesta_redis_data:
