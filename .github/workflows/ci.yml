name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesta-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesta_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesta_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci_access_secret_32_chars_minimum_abc
      JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_minimum_xyz
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cesta-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint --if-present
        continue-on-error: true
      - run: npm run audit:dtos
      - run: npm run audit:repos
      - run: npx jest --ci
      - run: npm run build

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesta-web
    env:
      API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cesta-web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
        continue-on-error: true
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cesta-web/coverage/
          retention-days: 7
      # Next 16 gera LayoutProps/PageProps types via `next build`; rodar tsc
      # standalone falha com TS2304. O proprio `next build` type-checa.
      - run: npm run build
        env:
          API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          # Sprint 55: Sentry source maps upload — secrets undefined → sourcemaps.disable
          # em withSentryConfig (next.config.ts) garante build normal sem upload.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: '0.1'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
