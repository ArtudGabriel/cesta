name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesta-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesta_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesta_test
      # Sprint 183 (ADR 0013): directUrl for prisma migrate; CI uses same local Postgres.
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/cesta_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci_access_secret_32_chars_minimum_abc
      JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_minimum_xyz
      NODE_ENV: test
      # Sprint 60: release tracking — Sentry anexa erros/perf ao commit SHA.
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cesta-api/package-lock.json
      - run: npm ci
      # Sprint 79: npm audit high gate — prod deps only (--omit=dev shrinks blast radius).
      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      # Sprint 183: derive_unpooled_url spec (render-build.sh helper, ADR 0013).
      - name: render-build.sh URL derivation spec
        run: bash scripts/render-build-url.test.sh
      # Sprint 188 G2: report-migrate-attempt observability helper (ADR 0013).
      - name: report-migrate-attempt structured output spec
        run: bash scripts/report-migrate-attempt.test.sh
      - run: npx prisma migrate deploy
      - run: npm run lint --if-present
        continue-on-error: true
      - run: npm run audit:dtos
      - run: npm run audit:repos
      # Sprint 194 (S71 nit close): split test run from coverage gate pra
      # clareza logs. Falha de test (bug) vs falha de threshold (regressão
      # coverage) ficam distinguíveis via step name.
      - name: Unit tests (jest, no coverage gate)
        run: npm run test:ci
      - name: Coverage threshold gate (jest --coverage)
        run: npm run test:coverage:gate -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api
          path: cesta-api/coverage/
          retention-days: 7
      - run: npm run build
      - name: Upload coverage to Codecov (api)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: cesta-api/coverage/lcov.info
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesta-web
    env:
      API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      # Sprint 60: release tracking propagado pro bundle client via NEXT_PUBLIC_.
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cesta-web/package-lock.json
      - run: npm ci
      # Sprint 79: npm audit gate — prod deps only (--omit=dev shrinks blast radius).
      # Sprint 94 follow-up: picomatch ReDoS (GHSA-fc5q-39xc-vjpf) atinge
      # <=4.0.7, sem patch upstream. Impacto é build-time apenas (transitivo
      # de @sentry/nextjs → @rollup/plugin-commonjs), não runtime. Filtra só
      # essa advisory; outros high+ continuam bloqueando.
      - name: npm audit (prod deps, high+ excluding picomatch build-time)
        run: |
          set +e
          out=$(npm audit --omit=dev --audit-level=high --json)
          set -e
          echo "$out" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);
              const vulns=j.vulnerabilities||{};
              const allowCve=new Set([1247710]); // GHSA-fc5q-39xc-vjpf picomatch
              const allowedPkg=new Set();
              // Fixpoint: pkg is allowed if every via entry is allowlisted CVE or references allowed pkg.
              for(let iter=0;iter<10;iter++){
                let changed=false;
                for(const [name,v] of Object.entries(vulns)){
                  if(allowedPkg.has(name))continue;
                  const via=v.via||[];
                  if(via.length===0)continue;
                  const ok=via.every(x=>typeof x==='object'?allowCve.has(x.source):allowedPkg.has(x));
                  if(ok){allowedPkg.add(name);changed=true;}
                }
                if(!changed)break;
              }
              let fail=0;
              for(const [name,v] of Object.entries(vulns)){
                if(!['high','critical'].includes(v.severity))continue;
                if(allowedPkg.has(name)){console.log('IGNORED (allowlisted):',name);continue;}
                fail++;console.error('UNALLOWED HIGH+:',name,'via',(v.via||[]).map(x=>x.source||x));
              }
              process.exit(fail>0?1:0);
            });"
      - run: npm run lint --if-present
        continue-on-error: true
      # Sprint 196: i18n parity gate (es.json vs pt-BR.json). Falha CI se
      # qualquer locale tiver keys faltando, type mismatch ou TODO drift.
      - name: i18n parity gate (es vs pt-BR)
        run: npm run i18n:parity
      # Sprint 194 (S71 nit close): split test run from coverage gate.
      - name: Unit tests (vitest, no coverage gate)
        run: npm run test:ci
      - name: Coverage threshold gate (vitest --coverage)
        run: npm run test:coverage:gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: cesta-web/coverage/
          retention-days: 7
      - name: Upload coverage to Codecov (web)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: cesta-web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
      # Next 16 gera LayoutProps/PageProps types via `next build`; rodar tsc
      # standalone falha com TS2304. O proprio `next build` type-checa.
      - run: npm run build
        env:
          API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          # Sprint 55: Sentry source maps upload — secrets undefined → sourcemaps.disable
          # em withSentryConfig (next.config.ts) garante build normal sem upload.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: '0.1'
          # Sprint 60: release tracking — bind no mesmo SHA do job root.
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
